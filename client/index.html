<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#022350" />
    <link rel="icon" type="image/svg+xml" href="/brand/safelink-app-icon.svg" />
    <link
      rel="alternate icon"
      type="image/png"
      href="/brand/safelink-logo.png"
    />
    <link rel="apple-touch-icon" href="/brand/safelink-logo.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="description"
      content="SafeLink helps communities report, verify, track, and respond to safety concerns."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>SafeLink — Community Safety, Connected</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #071b31;
      }
      .startup-shell {
        min-height: 100svh;
        overflow: hidden;
        color: #fff;
        background:
          radial-gradient(
            circle at 50% 13%,
            rgba(3, 177, 184, 0.12),
            transparent 29%
          ),
          linear-gradient(180deg, #071b31, #0a2a46 58%, #071b31);
        font-family: system-ui, sans-serif;
      }
      .startup-nav {
        height: 76px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .startup-wrap {
        width: min(1180px, calc(100% - 48px));
        margin: auto;
      }
      .startup-nav .startup-wrap {
        height: 100%;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 28px;
      }
      .startup-brand {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .startup-brand img {
        width: auto;
        height: 42px;
        padding: 4px 6px;
        border-radius: 9px;
        background: #fff;
      }
      .startup-links,
      .startup-actions {
        display: flex;
        align-items: center;
        gap: 27px;
      }
      .startup-actions {
        justify-content: flex-end;
      }
      .startup-hero {
        padding: 72px 0 108px;
        text-align: center;
      }
      .startup-copy {
        display: grid;
        justify-items: center;
        max-width: 940px;
        margin: auto;
      }
      .startup-line,
      .startup-map {
        display: block;
        border-radius: 10px;
        background-color: rgba(132, 160, 177, 0.18);
        background-image: linear-gradient(
          105deg,
          transparent 32%,
          rgba(183, 213, 220, 0.24) 46%,
          transparent 60%
        );
        background-size: 220% 100%;
        animation: startup-shimmer 1.6s ease-in-out infinite;
      }
      .startup-brand .startup-line {
        width: 88px;
        height: 20px;
      }
      .startup-links .startup-line {
        width: 70px;
        height: 12px;
      }
      .startup-actions .startup-line:first-child {
        width: 45px;
        height: 12px;
      }
      .startup-actions .startup-line:last-child {
        width: 152px;
        height: 42px;
      }
      .startup-eyebrow {
        width: 176px;
        height: 12px;
        margin-bottom: 28px;
      }
      .startup-title {
        width: min(690px, 78vw);
        height: clamp(54px, 7vw, 88px);
        border-radius: 18px;
      }
      .startup-copyline {
        width: min(650px, 82vw);
        height: 16px;
        margin-top: 28px;
      }
      .startup-copyline.short {
        width: min(490px, 64vw);
        margin-top: 10px;
      }
      .startup-buttons {
        display: flex;
        gap: 12px;
        margin-top: 34px;
      }
      .startup-buttons .startup-line {
        width: 190px;
        height: 49px;
        border-radius: 12px;
      }
      .startup-stats {
        width: min(860px, 100%);
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1px;
        margin: 64px auto 56px;
        padding: 22px 0;
        border-block: 1px solid rgba(255, 255, 255, 0.1);
      }
      .startup-stat {
        display: grid;
        justify-items: center;
        gap: 8px;
        border-left: 1px solid rgba(255, 255, 255, 0.08);
      }
      .startup-stat:first-child {
        border-left: 0;
      }
      .startup-stat .startup-line:first-child {
        width: 54px;
        height: 28px;
      }
      .startup-stat .startup-line:last-child {
        width: 92px;
        height: 9px;
      }
      .startup-map {
        position: relative;
        width: 100%;
        height: 600px;
        border: 1px solid rgba(167, 199, 226, 0.18);
        border-radius: 26px;
        background-color: #152d3d;
        overflow: hidden;
      }
      .startup-map::before,
      .startup-map::after {
        content: "";
        position: absolute;
        height: 10px;
        width: 65%;
        border-radius: 999px;
        background: rgba(186, 208, 213, 0.1);
        transform: rotate(14deg);
        top: 42%;
        left: -8%;
      }
      .startup-map::after {
        top: 68%;
        left: 46%;
        transform: rotate(-24deg);
      }
      .startup-mapbar {
        position: absolute;
        z-index: 2;
        top: 0;
        left: 0;
        right: 0;
        height: 52px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 22px;
        background: rgba(7, 27, 49, 0.9);
      }
      .startup-mapbar .startup-line {
        width: 145px;
        height: 10px;
      }
      .startup-mapbar .startup-line:last-child {
        width: 78px;
      }
      @keyframes startup-shimmer {
        from {
          background-position: 180% 0;
        }
        to {
          background-position: -80% 0;
        }
      }
      @media (max-width: 1000px) {
        .startup-nav {
          height: 70px;
        }
        .startup-nav .startup-wrap {
          display: flex;
          justify-content: space-between;
        }
        .startup-links,
        .startup-actions {
          display: none;
        }
        .startup-nav::after {
          content: "";
          position: absolute;
          width: 44px;
          height: 44px;
          border-radius: 10px;
          right: 24px;
          top: 13px;
          background: rgba(132, 160, 177, 0.18);
        }
        .startup-brand img {
          height: 34px;
        }
      }
      @media (max-width: 820px) {
        .startup-hero {
          padding-top: 58px;
        }
        .startup-map {
          height: 500px;
        }
      }
      @media (max-width: 540px) {
        .startup-wrap {
          width: calc(100% - 28px);
        }
        .startup-hero {
          padding: 48px 0 70px;
        }
        .startup-buttons {
          width: 100%;
          flex-direction: column;
        }
        .startup-buttons .startup-line {
          width: 100%;
        }
        .startup-stats {
          grid-template-columns: repeat(2, 1fr);
          row-gap: 22px;
        }
        .startup-stat:nth-child(3) {
          border-left: 0;
        }
        .startup-map {
          height: 430px;
          border-radius: 18px;
        }
        .startup-title {
          width: 90vw;
          height: 58px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-line,
        .startup-map {
          animation: startup-pulse 1.6s ease-in-out infinite;
          background-image: none;
        }
        @keyframes startup-pulse {
          50% {
            opacity: 0.72;
          }
        }
      }
      .startup-app {
        min-height: 100svh;
        display: grid;
        grid-template-columns: 256px 1fr;
        background: #f3f7f8;
      }
      .startup-app-side {
        padding: 24px 18px;
        background: linear-gradient(#071b31, #092a40);
      }
      .startup-app-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 25px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .startup-app-brand img {
        width: auto;
        height: 38px;
        padding: 4px 6px;
        border-radius: 8px;
        background: #fff;
      }
      .startup-app-brand .startup-line {
        width: 85px;
        height: 18px;
      }
      .startup-app-nav {
        display: grid;
        gap: 9px;
        padding-top: 24px;
      }
      .startup-app-nav .startup-line {
        width: 100%;
        height: 45px;
        border-radius: 10px;
      }
      .startup-app-main {
        min-width: 0;
      }
      .startup-app-top {
        height: 78px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
        border-bottom: 1px solid #dfe8ea;
        background: #fff;
      }
      .startup-app-top > .startup-line:first-child {
        width: 180px;
        height: 20px;
      }
      .startup-app-top > .startup-line:last-child {
        width: 150px;
        height: 42px;
      }
      .startup-app-content {
        padding: 30px 32px;
      }
      .startup-app-banner {
        height: 140px;
        border-radius: 20px;
        background-color: #0a4354;
      }
      .startup-app-stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin: 20px 0;
      }
      .startup-app-stats .startup-line {
        height: 86px;
        border-radius: 16px;
        background-color: #dce7e9;
      }
      .startup-app-panels {
        display: grid;
        grid-template-columns: 1.7fr 0.7fr;
        gap: 18px;
      }
      .startup-app-panels .startup-line {
        height: 360px;
        border-radius: 17px;
        background-color: #dce7e9;
      }
      @media (max-width: 820px) {
        .startup-app {
          grid-template-columns: 1fr;
        }
        .startup-app-side {
          display: none;
        }
        .startup-app-content {
          padding: 24px 18px;
        }
        .startup-app-stats {
          grid-template-columns: 1fr 1fr;
        }
        .startup-app-panels {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-shell" role="status" aria-label="Loading page">
        <header class="startup-nav">
          <div class="startup-wrap">
            <div class="startup-brand">
              <img
                src="/brand/safelink-logo.png"
                width="1080"
                height="859"
                alt="SafeLink"
              /><span class="startup-line"></span>
            </div>
            <div class="startup-links">
              <span class="startup-line"></span
              ><span class="startup-line"></span
              ><span class="startup-line"></span
              ><span class="startup-line"></span>
            </div>
            <div class="startup-actions">
              <span class="startup-line"></span
              ><span class="startup-line"></span>
            </div>
          </div>
        </header>
        <main class="startup-hero">
          <div class="startup-wrap">
            <div class="startup-copy">
              <span class="startup-line startup-eyebrow"></span
              ><span class="startup-line startup-title"></span
              ><span class="startup-line startup-copyline"></span
              ><span class="startup-line startup-copyline short"></span>
              <div class="startup-buttons">
                <span class="startup-line"></span
                ><span class="startup-line"></span>
              </div>
            </div>
            <div class="startup-stats">
              <div class="startup-stat">
                <span class="startup-line"></span
                ><span class="startup-line"></span>
              </div>
              <div class="startup-stat">
                <span class="startup-line"></span
                ><span class="startup-line"></span>
              </div>
              <div class="startup-stat">
                <span class="startup-line"></span
                ><span class="startup-line"></span>
              </div>
              <div class="startup-stat">
                <span class="startup-line"></span
                ><span class="startup-line"></span>
              </div>
            </div>
            <div class="startup-map">
              <div class="startup-mapbar">
                <span class="startup-line"></span
                ><span class="startup-line"></span>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script>
      try {
        const isCitizenRoute = location.pathname.startsWith("/app");
        const session = JSON.parse(
          localStorage.getItem("safelink.citizen.session"),
        );
        if (isCitizenRoute && session && session.role === "citizen") {
          document.getElementById("root").innerHTML =
            '<div class="startup-app" role="status" aria-label="Loading citizen dashboard"><aside class="startup-app-side"><div class="startup-app-brand"><img src="/brand/safelink-logo.png" alt="SafeLink"><span class="startup-line"></span></div><div class="startup-app-nav"><span class="startup-line"></span><span class="startup-line"></span><span class="startup-line"></span><span class="startup-line"></span><span class="startup-line"></span><span class="startup-line"></span><span class="startup-line"></span></div></aside><div class="startup-app-main"><header class="startup-app-top"><span class="startup-line"></span><span class="startup-line"></span></header><main class="startup-app-content"><div class="startup-line startup-app-banner"></div><div class="startup-app-stats"><span class="startup-line"></span><span class="startup-line"></span><span class="startup-line"></span><span class="startup-line"></span></div><div class="startup-app-panels"><span class="startup-line"></span><span class="startup-line"></span></div></main></div></div>';
        }
      } catch {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
